apiVersion: v2
name: backstage
description: Self-hosted Backstage deployment with PostgreSQL
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  # Bitnami PostgreSQL — battle-tested chart with probes, security context,
  # init scripts, metrics, and backup hooks. Toggleable via postgresql.enabled.
  - name: postgresql
    version: 15.5.38
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
