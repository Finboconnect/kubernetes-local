app:
  name: backstage
  image: brotherfranklyn/backstage
  imageTag: latest
  imagePullPolicy: IfNotPresent
  port: 7007
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  probes:
    enabled: false
    path: /healthcheck

# References the SealedSecret-decoded Secret in the deploy namespace.
postgresSecret:
  name: backstage-postgres-creds

backstageSecret:
  name: backstage-github-token

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  # host is set per-environment in dev.yaml / prod.yaml.
  path: /
  pathType: Prefix

# ----- In-house Postgres (replaces the Bitnami subchart) -----
postgres:
  enabled: true
  image: postgres
  imageTag: "16-alpine"
  username: backstage
  database: backstage
  port: 5432
  # PVC settings
  storageClass: standard           # kind's local-path-provisioner provides this
  storage: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
