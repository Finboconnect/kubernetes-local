apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: gha-runner-scale-set-controller
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    targetRevision: 0.9.3
    helm:
      releaseName: arc

  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems

  # The CRDs that the chart bundles get applied once and then live their own
  # life (kubectl defaults fields, conversion webhook may rewrite schemas).
  # Without this, Argo CD perpetually reports OutOfSync even though the
  # controller is healthy and running.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - '.spec.conversion'
        - '.spec.preserveUnknownFields'
        - '.spec.versions[].schema'

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
