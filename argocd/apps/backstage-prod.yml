apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd-image-updater.argoproj.io/image-list: backstage=brotherfranklyn/backstage
    argocd-image-updater.argoproj.io/backstage.update-strategy: semver
    argocd-image-updater.argoproj.io/backstage.allow-tags: regexp:^v\d+\.\d+\.\d+$
    argocd-image-updater.argoproj.io/backstage.helm.image-name: app.image
    argocd-image-updater.argoproj.io/backstage.helm.image-tag: app.imageTag
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default

  source:
    repoURL: https://github.com/Finboconnect/kubernetes-local.git
    targetRevision: main
    path: apps/backstage
    helm:
      releaseName: backstage
      valueFiles:
        - values.yaml
        - prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: backstage-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
