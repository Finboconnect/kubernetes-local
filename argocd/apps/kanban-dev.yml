apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kanban-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/test-application.git
    targetRevision: main
    path: .
    helm:
      releaseName: kanban-dev
      valueFiles:
        - environments/values.yml
        - environments/platform.yml
        - environments/dev.yml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
