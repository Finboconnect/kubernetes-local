apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-data
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # sync-wave: 0 — runs AFTER sealed-secrets (-1) so the CRD exists.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://github.com/Finboconnect/kubernetes-local.git
    targetRevision: main
    path: secrets
    directory:
      recurse: false
      include: '*.sealed.yaml'

  destination:
    server: https://kubernetes.default.svc
    # Namespace here is irrelevant — each SealedSecret declares its own.
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
