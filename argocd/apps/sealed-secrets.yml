apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # sync-wave: -1 makes Argo CD install this BEFORE every other app.
    # The SealedSecrets in secrets/ depend on the controller existing first.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default

  source:
    chart: sealed-secrets
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    targetRevision: 2.16.1
    helm:
      releaseName: sealed-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  # CRDs that the chart bundles produce phantom OutOfSync drift.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - '.spec.conversion'
        - '.spec.preserveUnknownFields'
        - '.spec.versions[].schema'

  syncPolicy:
    automated:
      prune: false        # never auto-delete the controller; losing it = losing decryption
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
