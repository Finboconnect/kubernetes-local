app:
  name: kanban
  image: brotherfranklyn/kanban-app:latest
  imagePullPolicy: IfNotPresent
  port: 360
  replicas: 1
  # Optional: only set these if your image needs overrides.
  # command: []
  # args: []
  # env:
  #   - name: PORT
  #     value: "360"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

service:
  type: ClusterIP
  port: 360

ingress:
  enabled: true
  host: kanban.localtest.me
  path: /
  pathType: Prefix
